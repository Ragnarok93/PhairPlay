name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  jvm-tests:
    name: JVM protocol tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant Gradle wrapper execute permission
        run: chmod +x gradlew

      - name: Run JVM protocol test suite
        run: ./gradlew :test-runner:test --stacktrace

      - name: Upload JVM test report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jvm-test-report
          path: test-runner/build/reports/tests/test/
          retention-days: 30
          if-no-files-found: ignore

  android-build:
    name: Android unit tests, lint & debug APK (${{ matrix.flavor }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - flavor: googletv
            unit_test_task: :app:testGoogletvDebugUnitTest
            lint_task: :app:lintGoogletvDebug
            assemble_task: :app:assembleGoogletvDebug
            apk_path: app/build/outputs/apk/googletv/debug/app-googletv-debug.apk
          - flavor: firetv
            unit_test_task: :app:testFiretvDebugUnitTest
            lint_task: :app:lintFiretvDebug
            assemble_task: :app:assembleFiretvDebug
            apk_path: app/build/outputs/apk/firetv/debug/app-firetv-debug.apk

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant Gradle wrapper execute permission
        run: chmod +x gradlew

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-35 build-tools;35.0.0'

      - name: Write local.properties
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Run app unit tests, lint and build debug APK
        run: ./gradlew ${{ matrix.unit_test_task }} ${{ matrix.lint_task }} ${{ matrix.assemble_task }} --stacktrace

      - name: Verify Fire TV runtime excludes Cast and Media3
        if: matrix.flavor == 'firetv'
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew :app:dependencies --configuration firetvDebugRuntimeClasspath > firetv-runtime-deps.txt
          if grep -E 'com\.google\.android\.gms|androidx\.media3' firetv-runtime-deps.txt; then
            echo "Fire TV runtime classpath unexpectedly contains Google Cast/Media3 dependencies." >&2
            exit 1
          fi

      - name: Upload build reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-reports-${{ matrix.flavor }}
          path: app/build/reports/
          retention-days: 30
          if-no-files-found: ignore

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: debug-apk-${{ matrix.flavor }}
          path: ${{ matrix.apk_path }}
          retention-days: 7
